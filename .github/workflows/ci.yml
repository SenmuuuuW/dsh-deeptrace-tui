name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: 无头渲染冒烟（无存档环境也应能构建数据）
        run: |
          node bin/deeptrace.mjs --help >/dev/null
          node bin/deeptrace.mjs --render overview --no-color --dsh-home /tmp/nonexistent-dsh >/dev/null 2>&1 || true
